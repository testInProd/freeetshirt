<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
 		    <title>Under Contruction - free tshirts are coming soon</title>
		<style>
			:root{--radius:14px}
			html,body{height:100%}
			body{
				margin:0;
				font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
				/* background image (covers full viewport) */
				background-image: url('https://images.unsplash.com/photo-1520975911664-4c6f41a1d5c6?auto=format&fit=crop&w=1400&q=80');
				background-size:cover;
				background-position:center;
				background-repeat:no-repeat;
				display:flex;
				align-items:center;
				justify-content:center;
			}

			/* dim the background and center the modal */
			.overlay{
				position:fixed;
				inset:0;
				background:rgba(0,0,0,0.45);
				display:flex;
				align-items:center;
				justify-content:center;
				padding:1.25rem;
			}

			.modal{
				background:rgba(255,255,255,0.98);
				border-radius:var(--radius);
				padding:2rem 2.25rem;
				max-width:680px;
				width:100%;
				box-shadow:0 10px 30px rgba(0,0,0,0.35);
				text-align:center;
			}

			.modal h1{
				margin:0 0 0.75rem 0;
				font-size:clamp(1.25rem,2.5vw,2rem);
				line-height:1.1;
				color:#111;
			}

			.modal p.extra-e{
				margin:0.5rem 0 0 0;
				font-size:1.25rem;
				color:#444;
				letter-spacing:0.06em;
				font-weight:600;
			}

			/* small visual cue for keyboard users */
			.modal:focus{outline:3px solid rgba(21,156,228,0.25)}

			@media (prefers-reduced-motion: no-preference){
				.modal{transform:translateY(-6px); transition:transform .28s ease,opacity .28s ease; opacity:1}
			}
		</style>
	</head>
	<body>
		<div class="overlay" role="presentation">
			<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="0">
				<h1 id="modal-title">Under Contruction</h1>
                <h2 class="extra-e">free<sub style="color:red; font-size:1rem; font-style:italic">e</sub>tshirts coming soon</h2>
                <p>👕</p>
			</div>
		</div>
	</body>
</html>
